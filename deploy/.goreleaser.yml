# https://goreleaser.com

version: 2

project_name: nexus-hub

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: nexus-hub
    main: .
    binary: nexus-hub
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm

archives:
  - id: binaries
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - debug.html

nfpms:
  - id: nexus-hub
    package_name: nexus-hub
    vendor: Nexus Hub Core
    homepage: https://github.com/asfrm/nexus-hub-core
    maintainer: asfrm <asfrm@users.noreply.github.com>
    description: 3D Printing Farm Orchestration Platform
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    release: 1
    epoch: 1
    section: default
    priority: optional
    contents:
      - src: debug.html
        dst: /usr/share/nexus-hub/debug.html
      - src: packaging/nexus-hub.service
        dst: /etc/systemd/system/nexus-hub.service
        type: config
        packager: deb
      - src: packaging/nexus-hub.service
        dst: /usr/lib/systemd/system/nexus-hub.service
        type: config
        packager: rpm

dockers:
  - id: docker-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/asfrm/nexus-hub-core:{{ .Version }}-amd64"
      - "ghcr.io/asfrm/nexus-hub-core:latest-amd64"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/amd64"

  - id: docker-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/asfrm/nexus-hub-core:{{ .Version }}-arm64"
      - "ghcr.io/asfrm/nexus-hub-core:latest-arm64"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: ghcr.io/asfrm/nexus-hub-core:{{ .Version }}
    image_templates:
      - ghcr.io/asfrm/nexus-hub-core:{{ .Version }}-amd64
      - ghcr.io/asfrm/nexus-hub-core:{{ .Version }}-arm64

  - name_template: ghcr.io/asfrm/nexus-hub-core:latest
    image_templates:
      - ghcr.io/asfrm/nexus-hub-core:latest-amd64
      - ghcr.io/asfrm/nexus-hub-core:latest-arm64

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "${GPG_FINGERPRINT}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^wip:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Performance
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Security
      regexp: "^.*security[(\\w)]*:+.*$"
      order: 3
    - title: Other Changes
      order: 999

release:
  github:
    owner: asfrm
    name: nexus-hub-core
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## 🚀 Nexus Hub Core {{ .Tag }}
    
    **Released:** {{ .Date }}
    **Commit:** {{ .FullCommit }}
    
    ### What's Changed
    
  footer: |
    ## 📦 Installation
    
    ### Docker
    ```bash
    docker pull ghcr.io/asfrm/nexus-hub-core:{{ .Version }}
    ```
    
    ### Linux Package
    ```bash
    # Debian/Ubuntu
    sudo dpkg -i nexus-hub_{{ .Version }}_amd64.deb
    
    # RHEL/CentOS/Fedora
    sudo rpm -i nexus-hub_{{ .Version }}_amd64.rpm
    ```
    
    ## 📝 Full Changelog
    
    [View complete changes](https://github.com/asfrm/nexus-hub-core/compare/{{ .PreviousTag }}...{{ .Tag }})
    
    ---
    
    **Need help?** Open an [issue](https://github.com/asfrm/nexus-hub-core/issues)

announce:
  discord:
    enabled: false
    message_template: |
      🚀 **Nexus Hub Core {{ .Tag }}** has been released!
      
      Check it out: {{ .ReleaseURL }}
